[book]
authors = ["Stefan Höck", "Nathan McCarty"]
language = "ja"
src = "src"
title = "Idris 2 チュートリアル"

[build]
create-missing = false

[output.html]
preferred-dark-theme = "ayu"
default-theme = "rust"
git-repository-url = "https://github.com/idris-community/idris2-tutorial"

[output.html.print]
enable = true
page-break = true

[output.html.fold]
enable = true
level = 0
